title: Luc DiMarzio
description: Luc DiMarzio — music, playlists and writing about hip-hop and faith.
markdown: kramdown
url: "https://lucdimarzio.com"
share_image: /assets/img/share.jpg

# Builds /sitemap.xml so Google can find every page
plugins:
  - jekyll-sitemap

# Album reviews live in _reviews/ — one Markdown file per review.
# To add a review, copy any file in _reviews/, rename it, and change the details at the top.
collections:
  reviews:
    output: true
    permalink: /writing/reviews/:name/
  # Team trainings live in _trainings/ — one file per training, slides in assets/img/trainings/<name>/
  trainings:
    output: true
    permalink: /writing/leadership/:name/

defaults:
  - scope:
      path: ""
      type: reviews
    values:
      layout: review
  - scope:
      path: ""
      type: trainings
    values:
      layout: training

submit_form_endpoint: "https://formspree.io/f/xvkazedg"
